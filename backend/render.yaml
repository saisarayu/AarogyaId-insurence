services:
  - type: web
    name: insurance-ai-backend
    runtime: python3
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        fromSecret: mongo-db-name
      - key: MONGO_COLLECTION_NAME
        fromSecret: mongo-collection-name
      - key: CHROMA_PERSIST_DIR
        fromSecret: chroma-persist-dir
      - key: CHROMA_COLLECTION_NAME
        fromSecret: chroma-collection-name
      - key: MAX_CHUNK_SIZE
        fromSecret: max-chunk-size
      - key: MIN_CHUNK_SIZE
        fromSecret: min-chunk-size